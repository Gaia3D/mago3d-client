mutation createLayerGroup($input:CreateGroupInput!) @api(name: layerset) {
    createGroup (
        input: $input
    )
    {
        id
        name
        description
        enabled
        published
        createdAt
        createdBy
        updatedAt
        updatedBy
    }
}

mutation updateLayerGroup($id:ID!, $input: UpdateGroupInput!) @api(name: layerset) {
    updateGroup (
        id: $id
        input: $input
    )
    {
        id
        name
        description
        enabled
        published
        createdAt
        createdBy
        updatedAt
        updatedBy
    }
}

mutation deleteLayerGroup($id:ID!) @api(name: layerset) {
    deleteGroup (
        ids: [$id]
    )
}

mutation createLayerAsset($input:CreateAssetInput!) @api(name: layerset) {
    createAsset (
        input: $input
    )
    {
        id
        name
    }
}

mutation updateLayerAsset($id:ID!, $input: UpdateAssetInput!) @api(name: layerset) {
    updateAsset (
        id: $id
        input: $input
    )
    {
        id
        name
        description
        order
        type
        enabled
        visible
        access
        createdAt
        createdBy
        updatedAt
        updatedBy
    }
}

mutation locateLayerGroup($id:ID!, $input: LocateGroupInput!) @api(name: layerset) {
    locateGroup (
        id: $id
        input: $input
    )
    {
        id
    }
}
mutation locateLayerAsset($input: LocateAssetInput!) @api(name: layerset) {
    locateAsset (
        input: $input
    )
    {
        id
    }
}

mutation deleteLayerAsset($ids:ID!) @api(name: layerset) {
    deleteAsset (
        ids: [$ids]
    )
}

mutation reloadRemoteLayerAsset($layerKey:String!) @api(name: layerset) {
    reloadRemoteAsset (
        layerKey: $layerKey
    )
}

mutation createLayerStyle($input:CreateStyleInput!) @api(name: layerset) {
    createStyle (
        input: $input
    )
    {
        id
        name
    }
}

mutation updateLayerStyle($id:ID!, $input: UpdateStyleInput!) @api(name: layerset) {
    updateStyle (
        id: $id
        input: $input
    )
    {
        id
        name
        format
        description
        enabled
        defaultStatus
        access
        createdAt
        createdBy
        updatedAt
        updatedBy
    }
}

mutation deleteLayerStyle($id:ID!) @api(name: layerset) {
    deleteStyle (
        ids: [$id]
    )
}

mutation applyLayerStyle($id:ID!, $styleId: ID!) @api(name: layerset) {
    applyAssetStyle (
        id: $id
        styleId: $styleId
    )
    {
        id
        name
        styles {
            id
            name
        }
    }
}

mutation CreateAttributes($assetId: ID!, $input: [CreateAttributeInput]!) @api(name: layerset) {
  createAttributes(assetId: $assetId, input: $input) {
        id
        categoryName
        sortOrder
        createdBy
        createdAt
        updatedBy
        updatedAt
        properties {
            id
            field
            value
            label
            weight
            sortOrder
        }
    }
}

mutation UpdateAttributes($assetId: ID!, $input: [UpdateAttributeInput]!) @api(name: layerset) {
    updateAttributes(assetId: $assetId, input: $input) {
        id
        categoryName
        sortOrder
        createdBy
        createdAt
        updatedBy
        updatedAt
        properties {
            id
            field
            value
            label
            weight
            sortOrder
            createdBy
            createdAt
            updatedBy
            updatedAt
        }
    }
}

mutation ApplyDefaultStyle($id: ID!, $styleId: ID!) @api(name: layerset) {
    applyDefaultStyle(id: $id, styleId: $styleId) {
        id
        name
        description
        type
        enabled
        visible
        access
        status
        order
        createdBy
        createdAt
        updatedBy
        updatedAt
        properties
    }
}