query FindAssetsByFilter($filter: AssetFilterInput) @api(name: layerset) {
    assets(filter: $filter) {
        id
        name
        description
        type
        enabled
        visible
        printable
        access
        status
        order
        createdBy
        createdAt
        updatedBy
        updatedAt
        properties
    }
}

query LayersetGroupList @api(name: layerset) {
    groups {
        id
        name
        enabled
        access
    }
}

fragment LayersetGroupBasic on LayerGroup {
    id
    name
    description
    enabled
    access
    order
    collapsed
    createdAt
    updatedAt
}

fragment LayersetAssetBasic on LayerAsset {
    id
    name
    description
    type
    enabled
    visible
    access
    status
    createdAt
    updatedAt
    properties
    styles {
        id
        name
        type
        format
        description
        enabled
        defaultStatus
        access
        context
        backgroundId
    }
}

query LayersetGroupListWithAsset($filter: GroupFilterInput) @api(name: layerset) {
  groups(filter: $filter) {
    ...LayersetGroupBasic
    assets {
      ...LayersetAssetBasic
    }
  }
}
query GroupById($id: ID!) @api(name: layerset) {
    group(
        id: $id
    ) {
        id
        name
        description
        order
        enabled
        published
        collapsed
        access
        createdBy
        createdAt
        updatedBy
        updatedAt
    }
}

query LayersetAsset($id: ID!) @api(name: layerset) {
    asset(
        id : $id
    )
    {
        ...LayersetAssetBasic
        properties
        groups {
            id
            name
        }
        logs {
            id
            assetId
            type
            content
            createdAt
            updatedAt
        }
        styles {
            id
            name
            defaultStatus
            context
        }
    }
}

fragment layerGroupBasic on LayerGroup {
    id
    name
    description
    enabled
    published
    collapsed
    access
    order
}

fragment layerAssetBasic on LayerAsset {
    id
    name
    description
    type
    enabled
    visible
    order
    access
    createdAt
    updatedAt
}

query layerGroups($filter: GroupFilterInput){
    groups(filter: $filter) {
        ...layerGroupBasic
        assets {
            ...layerAssetBasic
            logs {
                id
                assetId
                type
                content
            }
        }
    }
}

query layerAsset($id: ID!){
    asset(
        id : $id
    )
    {
        id
        name
        description
        type
        enabled
        visible
        access
        createdBy
        createdAt
        updatedBy
        updatedAt
        properties
    }
}

query layerGroup($id: ID!) @api(name: layerset){
    group(
        id : $id
    )
    {
        ...layerGroupBasic
        assets {
            ...layerAssetBasic
            logs {
                id
                assetId
                type
                content
            }
        }
    }
}

query remote($href: String!) @api(name: layerset) {
    remote (href: $href)
}

query classifyAttribute($nativeName: String!, $attribute: String!) @api(name: layerset) {
    classifyAttribute(nativeName: $nativeName, attribute: $attribute) {
        type
        rules {
            min
            max
            eq
            color
        }
    }
}

query AttributeByNativeName($name: String!) @api(name: layerset) {
  attributeByNativeName(name: $name) {
    id
    categoryName
    sortOrder
    properties {
        id
        field
        value
        label
        weight
        sortOrder
    }
  }
}

query PreviewColumns($assetID: ID!) @api(name: layerset) {
  previewColumns(assetId: $assetID) {
    field
    value
    isString
  }
}

query Backgrounds @api(name: layerset) {
    backgrounds {
        id
        type
        url
        color
        name
        image
        createdBy
        createdAt
        updatedBy
        updatedAt
    }
}